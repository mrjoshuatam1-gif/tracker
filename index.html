<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Evolve">
<title>Evolve</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000'/><circle cx='50' cy='50' r='22' fill='none' stroke='%23F2F0EB' stroke-width='6'/></svg>">

<script src="config.js"></script>
<script src="quotes.js"></script>

<style>
  :root{
    --void:#000000;
    --surface:#0A0A0A;
    --bone:#F2F0EB;
    --ash:#6E6E6B;
    --seam:#2A2A28;
    --dim:#3D3D3A;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    --serif:ui-serif,"New York",Georgia,"Times New Roman",serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--void);color:var(--bone);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  #app{
    min-height:100dvh;max-width:520px;margin:0 auto;
    padding:max(28px,env(safe-area-inset-top)) 26px max(28px,env(safe-area-inset-bottom));
    display:flex;flex-direction:column;
  }
  .screen{display:none;flex:1;flex-direction:column;animation:rise .45s ease both;}
  .screen.on{display:flex;}
  @keyframes rise{from{opacity:0;transform:translateY(7px);}to{opacity:1;transform:none;}}

  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ash);}
  .date{font-size:26px;font-weight:500;letter-spacing:-.01em;margin-top:3px;}

  /* home */
  #home{justify-content:space-between;}
  .hrow{display:flex;justify-content:space-between;align-items:flex-start;}
  .qwrap{text-align:center;padding:0 2px;}
  #quote{
    font-family:var(--serif);font-size:29px;line-height:1.46;letter-spacing:-.015em;
    animation:fade 1.2s ease both;
  }
  #attrib{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
    margin-top:26px;animation:fade 1.2s .25s ease both;
  }
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  #enter{
    font-size:13px;letter-spacing:.42em;text-transform:lowercase;color:var(--ash);
    padding:22px 40px;background:none;border:0;font-family:var(--sans);cursor:pointer;
    animation:breathe 3.4s ease-in-out infinite;align-self:center;
  }
  @keyframes breathe{0%,100%{opacity:.42;}50%{opacity:1;}}
  #enter:active{color:var(--bone);}

  /* rows */
  .rows{margin-top:26px;}
  .row{
    display:flex;align-items:center;gap:14px;padding:15px 0;
    border-top:.5px solid var(--seam);cursor:pointer;user-select:none;
  }
  .rows .row:last-child{border-bottom:.5px solid var(--seam);}
  .ring{
    width:23px;height:23px;border-radius:50%;border:1.5px solid var(--dim);
    flex:none;position:relative;transition:background .22s ease,border-color .22s ease;
  }
  .row.done .ring{background:var(--bone);border-color:var(--bone);}
  .ring::after{
    content:"";position:absolute;left:7px;top:3.5px;width:5px;height:10px;
    border:solid var(--void);border-width:0 1.6px 1.6px 0;transform:rotate(45deg) scale(0);
    transition:transform .22s cubic-bezier(.2,1.4,.4,1);
  }
  .row.done .ring::after{transform:rotate(45deg) scale(1);}
  .label{font-size:16px;transition:color .22s ease;}
  .row.done .label{color:var(--ash);text-decoration:line-through;text-decoration-thickness:.5px;}

  /* meter */
  .meter{margin-top:auto;padding-top:30px;}
  .meter .line{display:flex;justify-content:space-between;font-size:13px;color:var(--ash);}
  .track{height:2px;background:var(--seam);border-radius:2px;margin-top:9px;overflow:hidden;}
  .fill{height:100%;background:var(--bone);border-radius:2px;transition:width .4s ease;width:0;}
  .segs{display:flex;gap:5px;margin-top:11px;}
  .seg{
    flex:1;height:3px;background:var(--seam);border-radius:2px;
    transition:background .35s ease,transform .35s cubic-bezier(.2,1.4,.4,1);
  }
  .seg.on{background:var(--bone);transform:scaleY(1.7);}

  /* month */
  .wheel{position:relative;width:min(230px,64vw);margin:24px auto 0;}
  .wheel svg{width:100%;height:auto;transform:rotate(-90deg);overflow:visible;}
  .wt{fill:none;stroke:var(--seam);stroke-width:3;}
  .wg{
    fill:none;stroke:var(--dim);stroke-width:3;stroke-linecap:round;
    stroke-dasharray:389.56;stroke-dashoffset:389.56;
  }
  .wa{
    fill:none;stroke:var(--bone);stroke-width:3;stroke-linecap:round;
    stroke-dasharray:389.56;stroke-dashoffset:389.56;
  }
  .wc{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:6px;
  }
  .big{font-size:52px;font-weight:300;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;}
  .sub{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ash);}
  .ctr{text-align:center;margin-top:22px;}
  .cats{margin-top:38px;}
  .cat{padding:14px 0;border-top:.5px solid var(--seam);}
  .cat .line{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px;}
  .cat .pct{color:var(--ash);}
  .past{margin-top:36px;}
  .past .row{cursor:default;justify-content:space-between;padding:13px 0;}
  .past .row:last-child{border-bottom:.5px solid var(--seam);}
  .past .m{font-size:15px;}
  .past .p{font-size:15px;color:var(--ash);font-variant-numeric:tabular-nums;}
  .empty{font-size:14px;color:var(--dim);padding:16px 0;line-height:1.6;}

  /* nav */
  nav{display:flex;margin-top:34px;padding-top:19px;border-top:.5px solid var(--seam);}
  nav button{
    flex:1;padding:6px 0;background:none;border:0;text-align:left;
    color:var(--ash);font-family:var(--sans);font-size:12px;letter-spacing:.22em;
    text-transform:uppercase;cursor:pointer;transition:color .2s;
  }
  nav button:last-child{text-align:right;}
  nav button:active{color:var(--bone);}
  :focus-visible{outline:1px solid var(--ash);outline-offset:3px;}
  #flag{font-size:10px;letter-spacing:.1em;color:#242422;text-align:center;margin-top:14px;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<div id="app">

  <section id="home" class="screen on">
    <div class="hrow">
      <div>
        <div class="eyebrow" id="h-day">&nbsp;</div>
        <div class="date" id="h-date">&nbsp;</div>
      </div>
      <div style="text-align:right;">
        <div class="eyebrow" id="h-mon">&nbsp;</div>
        <div class="date" id="h-pct" style="color:var(--ash);">&nbsp;</div>
      </div>
    </div>
    <div class="qwrap">
      <div id="quote">&nbsp;</div>
      <div id="attrib">&nbsp;</div>
    </div>
    <button id="enter">enter</button>
  </section>

  <section id="today" class="screen">
    <div class="eyebrow" id="t-day">&nbsp;</div>
    <div class="date" id="t-date">&nbsp;</div>
    <div class="rows" id="t-rows"></div>
    <div class="meter">
      <div class="line"><span id="t-count"></span><span id="t-pct"></span></div>
      <div class="segs" id="t-segs"></div>
    </div>
    <nav>
      <button data-go="home">Home</button>
      <button data-go="month">Month</button>
    </nav>
    <div id="flag"></div>
  </section>

  <section id="month" class="screen">
    <div class="wheel" style="margin-top:6px;">
      <svg viewBox="0 0 140 140" aria-hidden="true">
        <circle class="wt" cx="70" cy="70" r="62"></circle>
        <circle class="wg" id="m-ghost" cx="70" cy="70" r="62"></circle>
        <circle class="wa" id="m-arc" cx="70" cy="70" r="62"></circle>
      </svg>
      <div class="wc">
        <div class="big" id="m-big">100%</div>
        <div class="sub" id="m-name"></div>
      </div>
    </div>
    <div class="sub ctr" id="m-days"></div>
    <div class="cats" id="m-cats"></div>
    <div class="past">
      <div class="eyebrow" style="margin-bottom:6px;">every month before</div>
      <div id="m-past"></div>
    </div>
    <nav style="margin-top:auto;">
      <button data-go="home">Home</button>
      <button data-go="today">Today</button>
    </nav>
  </section>

</div>

<script>
const HABITS=[
  {id:"god",   label:"Time with God",          cat:"Faith"},
  {id:"crea",  label:"Creatine + supplements", cat:"Body"},
  {id:"gym",   label:"Gym",                    cat:"Body"},
  {id:"biz",   label:"Business",               cat:"Work"},
  {id:"read",  label:"Read",                   cat:"Mind"},
  {id:"skin",  label:"Skincare",               cat:"Body"},
  {id:"social",label:"Socials under 2h",       cat:"Mind"}
];
const CATS=["Faith","Body","Work","Mind"];

const QUOTES=(window.EVOLVE_QUOTES&&window.EVOLVE_QUOTES.length)
  ? window.EVOLVE_QUOTES.map(q=>[q,""])
  : [["Add your lines to quotes.js",""]];

const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONS=["January","February","March","April","May","June","July","August","September","October","November","December"];

/* storage that never throws */
const mem={};
const store={
  get(k){try{return localStorage.getItem(k);}catch(e){return mem[k]??null;}},
  set(k,v){try{localStorage.setItem(k,v);}catch(e){mem[k]=v;}}
};

const CFG = window.EVOLVE_CONFIG || {url:"",key:""};
const synced = CFG.url.length>0 && CFG.key.length>0;
let days = JSON.parse(store.get("evolve")||"{}");

const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=new Date();
const TKEY=ymd(today);
const active=k=>HABITS;
const checks=k=>(days[k]&&days[k].c)||{};

function save(){store.set("evolve",JSON.stringify(days));}

async function pull(){
  if(!synced)return;
  try{
    const r=await fetch(CFG.url+"/rest/v1/evolve_days?select=*",{headers:{apikey:CFG.key}});
    if(!r.ok)return;
    for(const row of await r.json()){
      const mine=days[row.day];
      if(!mine||(row.updated_at||0)>(mine.u||0)) days[row.day]={c:JSON.parse(row.checks||"{}"),u:row.updated_at||0};
    }
    save();paintToday();paintMonth(false);
  }catch(e){}
}
async function push(k){
  if(!synced)return;
  try{
    await fetch(CFG.url+"/rest/v1/evolve_days",{
      method:"POST",
      headers:{apikey:CFG.key,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates"},
      body:JSON.stringify({day:k,checks:JSON.stringify(days[k].c),updated_at:days[k].u})
    });
  }catch(e){}
}

function toggle(id){
  if(!days[TKEY])days[TKEY]={c:{},u:0};
  days[TKEY].c[id]=!days[TKEY].c[id];
  days[TKEY].u=Date.now();
  save();paintToday();paintMonth(false);push(TKEY);
}

function paintHome(){
  document.getElementById("h-day").textContent=DAYS[today.getDay()];
  document.getElementById("h-date").textContent=MONS[today.getMonth()]+" "+today.getDate();
  const s=stats(today.getFullYear(),today.getMonth());
  document.getElementById("h-mon").textContent=MONS[today.getMonth()];
  document.getElementById("h-pct").textContent=s.pct+"%";
  const q=QUOTES[Math.floor(Math.random()*QUOTES.length)];
  const el=document.getElementById("quote"),at=document.getElementById("attrib");
  const n=q[0].length;
  el.style.fontSize=n<18?"46px":n<32?"36px":n<46?"30px":"27px";
  el.textContent=q[0];at.textContent=q[1];at.style.display=q[1]?"":"none";
  el.style.animation="none";at.style.animation="none";el.offsetHeight;
  el.style.animation="";at.style.animation="";
}

function paintToday(){
  document.getElementById("t-day").textContent=DAYS[today.getDay()];
  document.getElementById("t-date").textContent=MONS[today.getMonth()]+" "+today.getDate();
  const c=checks(TKEY),wrap=document.getElementById("t-rows");
  wrap.innerHTML="";
  for(const h of HABITS){
    const on=!!c[h.id];
    const row=document.createElement("div");
    row.className="row"+(on?" done":"");
    row.innerHTML='<span class="ring"></span><span class="label"></span>';
    row.querySelector(".label").textContent=h.label;
    row.tabIndex=0;row.setAttribute("role","checkbox");row.setAttribute("aria-checked",on);
    row.onclick=()=>toggle(h.id);
    row.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();toggle(h.id);}};
    wrap.appendChild(row);
  }
  const done=HABITS.filter(h=>c[h.id]).length,pct=Math.round(done/HABITS.length*100);
  document.getElementById("t-count").textContent=done+" of "+HABITS.length;
  document.getElementById("t-pct").textContent=pct+"%";
  const sw=document.getElementById("t-segs");
  sw.innerHTML="";
  HABITS.forEach((h,i)=>{
    const s=document.createElement("span");
    s.className="seg"+(i<done?" on":"");
    s.style.transitionDelay=(i*22)+"ms";
    sw.appendChild(s);
  });
  document.getElementById("flag").textContent=synced?"":"saving to this device only";
}

function firstDay(){
  const ks=Object.keys(days).filter(k=>days[k].c&&Object.keys(days[k].c).some(i=>days[k].c[i]));
  return ks.length?ks.sort()[0]:TKEY;
}

function monthDays(y,m){
  const last=new Date(y,m+1,0).getDate(),from=firstDay(),out=[];
  for(let d=1;d<=last;d++){
    const k=ymd(new Date(y,m,d));
    if(k<from)continue;
    out.push(k);
  }
  return out;
}

function stats(y,m){
  const all=monthDays(y,m),total=all.length*HABITS.length;
  let done=0,perfect=0,elapsed=0;
  const cat={};CATS.forEach(c=>cat[c]=[0,0]);
  for(const k of all){
    if(k<=TKEY)elapsed++;
    const c=checks(k);let hit=0;
    for(const h of HABITS){
      cat[h.cat][1]++;
      if(c[h.id]){done++;hit++;cat[h.cat][0]++;}
    }
    if(hit===HABITS.length)perfect++;
  }
  return{done,total,days:all.length,elapsed,perfect,
    pct:total?Math.round(done/total*100):0,
    pace:all.length?Math.round(elapsed/all.length*100):0,cat};
}

const CIRC=389.557;
const still=window.matchMedia("(prefers-reduced-motion:reduce)").matches;

function spin(pct,pace){
  const arc=document.getElementById("m-arc"),gh=document.getElementById("m-ghost"),
        num=document.getElementById("m-big");
  gh.style.strokeDashoffset=CIRC*(1-pace/100);
  if(still){num.textContent=pct+"%";arc.style.strokeDashoffset=CIRC*(1-pct/100);return;}
  const t0=performance.now(),dur=1150;
  function step(t){
    const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3),v=pct*e;
    num.textContent=Math.round(v)+"%";
    arc.style.strokeDashoffset=CIRC*(1-v/100);
    if(p<1)requestAnimationFrame(step);
  }
  num.textContent="0%";arc.style.strokeDashoffset=CIRC;
  requestAnimationFrame(step);
}

function paintMonth(anim){
  const s=stats(today.getFullYear(),today.getMonth());
  document.getElementById("m-name").textContent=MONS[today.getMonth()]+" "+today.getFullYear();
  document.getElementById("m-days").textContent=
    "Day "+s.elapsed+" of "+s.days+", "+s.perfect+" perfect";
  if(anim)spin(s.pct,s.pace);
  else{
    document.getElementById("m-big").textContent=s.pct+"%";
    document.getElementById("m-arc").style.strokeDashoffset=CIRC*(1-s.pct/100);
    document.getElementById("m-ghost").style.strokeDashoffset=CIRC*(1-s.pace/100);
  }
  const cw=document.getElementById("m-cats");cw.innerHTML="";
  for(const c of CATS){
    const[a,b]=s.cat[c],p=b?Math.round(a/b*100):0;
    const el=document.createElement("div");
    el.className="cat";
    el.innerHTML='<div class="line"><span></span><span class="pct">'+(b?p+"%":"not yet")+'</span></div><div class="track"><div class="fill" style="width:'+p+'%"></div></div>';
    el.querySelector("span").textContent=c;
    cw.appendChild(el);
  }
  const keys=Object.keys(days).filter(k=>Object.values(days[k].c||{}).some(Boolean)).sort();
  const pw=document.getElementById("m-past");pw.innerHTML="";
  const seen=new Set();let any=false;
  for(const k of keys){
    const y=+k.slice(0,4),m=+k.slice(5,7)-1,id=y+"-"+m;
    if(seen.has(id))continue;seen.add(id);
    if(y===today.getFullYear()&&m===today.getMonth())continue;
    any=true;
    const st=stats(y,m);
    const row=document.createElement("div");
    row.className="row";
    row.innerHTML='<span class="m"></span><span class="p">'+st.pct+'%</span>';
    row.querySelector(".m").textContent=MONS[m]+" "+y;
    pw.appendChild(row);
  }
  if(!any)pw.innerHTML='<div class="empty">Nothing behind you yet. August shows up here on the first.</div>';
}

function go(name){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  document.getElementById(name).classList.add("on");
  if(name==="home")paintHome();
  if(name==="month")paintMonth(true);
  window.scrollTo(0,0);
}
document.getElementById("enter").onclick=()=>go("today");
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.go));

paintHome();paintToday();paintMonth(false);pull();
document.addEventListener("visibilitychange",()=>{if(!document.hidden)pull();});
</script>
</body>
</html>
